<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form method="GET">
        {% csrf_token %}
        <input type="text", name="q" placeholder="Search students..." value = {{query}}>
        <button type="submit">Search</button>
    </form>

    {% for cust in customers %}
    <div>
     <h1>{{cust.fullname}}</h1>   
     <p>{{cust.age}}</p>
     <p>{{cust.phone}}</p>
     <p>{{cust.email}}</p>
    </div>
    {% endfor %}
</body>
</html>
